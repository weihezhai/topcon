[project]
name = "topcon"
version = "0.1.0"
description = "sustainable AI paper acceptance prediction"
readme = "README.md"
requires-python = ">=3.12.3"
dependencies = [
    "accelerate>=1.12.0",
    "datasets>=4.4.1",
    "dropbox>=12.0.2",
    "openai>=2.5.0",
    "openreview-py>=1.52.8",
    "pandas>=2.3.3",
    "peft>=0.18.0",
    "qwen-vl-utils>=0.0.14",
    "requests>=2.32.0",
    "scikit-learn>=1.7.2",
    "torch>=2.7.1",
    "torchvision>=0.22.0",
    "transformers>=4.56.1",
    "urllib3==2.5.0",
]

[project.optional-dependencies]
gpu = [
    "deepspeed>=0.18.3",
]

[tool.uv]
no-build-isolation-package = ["flash-attn"]
